<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Memory</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f7f0e6;
      color: #4a2a1d;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at top, #fff9ef 0%, #f4dec4 30%, #e7d0a2 100%);
    }

    .app {
      width: min(100vw, 820px);
      height: min(100vh, 900px);
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 28px 60px rgba(86, 49, 19, 0.18);
      background: linear-gradient(180deg, #fffaf4 0%, #f9f1df 100%);
      border: 3px solid rgba(120, 75, 35, 0.18);
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      padding: 30px 28px 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0.08));
    }

    .screen.active {
      display: block;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-tag {
      position: absolute;
      right: 24px;
      top: 18px;
      background: rgba(138, 84, 47, 0.12);
      color: #7a4c2d;
      border: 1px solid rgba(122, 76, 45, 0.15);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .photo-wrap {
      width: 100%;
      height: calc(100% - 72px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 34px;
      border-radius: 18px;
      background: rgba(255,255,255,0.28);
      border: 1px solid rgba(116, 82, 61, 0.12);
      box-shadow: inset 0 0 18px rgba(255,255,255,0.22);
      overflow: hidden;
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #f7efe4;
    }

    .title {
      position: absolute;
      left: 28px;
      top: 20px;
      font-size: 20px;
      font-weight: 700;
      color: #7a4c2d;
      letter-spacing: 0.08em;
    }

    .nav {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(120, 84, 52, 0.12);
      backdrop-filter: blur(8px);
    }

    .nav button {
      appearance: none;
      border: none;
      background: #bb825c;
      color: white;
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(187,130,92,0.28);
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .nav button:hover {
      transform: translateY(-1px);
    }

    .nav button:active {
      transform: translateY(0);
    }

    .nav button.secondary {
      background: #dfb788;
      color: #5d3a28;
    }

    .nav .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(122, 76, 45, 0.25);
    }

    .nav .dot.active {
      background: #a35d3a;
      box-shadow: 0 0 0 5px rgba(163, 93, 58, 0.12);
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="screen active">
      <div class="title">Memory 1</div>
      <div class="page-tag">Page 1 / 4</div>
      <div class="photo-wrap">
        <img class="default-photo" alt="Memory 1" />
      </div>
    </section>

    <section class="screen">
      <div class="title">Memory 2</div>
      <div class="page-tag">Page 2 / 4</div>
      <div class="photo-wrap">
        <img class="default-photo" alt="Memory 2" />
      </div>
    </section>

    <section class="screen">
      <div class="title">Memory 3</div>
      <div class="page-tag">Page 3 / 4</div>
      <div class="photo-wrap">
        <img class="default-photo" alt="Memory 3" />
      </div>
    </section>

    <section class="screen">
      <div class="title">Memory 4</div>
      <div class="page-tag">Page 4 / 4</div>
      <div class="photo-wrap">
        <img class="default-photo" alt="Memory 4" />
      </div>
    </section>

    <div class="nav">
      <button class="secondary" id="prevBtn">上一页</button>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <button id="nextBtn">下一页</button>
    </div>
  </div>

  <script>
    const defaultImages = [
      'images/1.jpg',
      'images/2.jpg',
      'images/3.jpg',
      'images/4.jpg'
    ];

    const images = document.querySelectorAll('.default-photo');
    images.forEach((img, index) => {
      img.src = defaultImages[index];
      img.onerror = () => {
        img.src = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
            <rect width="800" height="1000" fill="#f5e3c9"/>
            <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="36" fill="#8a5b3a" font-family="Microsoft YaHei, Arial">Image ${index + 1}</text>
          </svg>
        `);
      };
    });

    const screens = [...document.querySelectorAll('.screen')];
    const dots = [...document.querySelectorAll('.dot')];
    let index = 0;

    function render() {
      screens.forEach((screen, i) => {
        screen.classList.toggle('active', i === index);
      });

      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });

      document.querySelector('.page-tag').textContent = `Page ${index + 1} / ${screens.length}`;
    }

    document.getElementById('nextBtn').addEventListener('click', () => {
      index = (index + 1) % screens.length;
      render();
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      index = (index - 1 + screens.length) % screens.length;
      render();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight' || event.key === 'PageDown') {
        index = (index + 1) % screens.length;
        render();
      }
      if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
        index = (index - 1 + screens.length) % screens.length;
        render();
      }
    });

    render();
  </script>
</body>
</html>
